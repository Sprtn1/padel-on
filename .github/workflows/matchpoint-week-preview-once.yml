name: Import one MatchPoint booking week (one-time)

# ONE-TIME user-authorized trusted-main push. Remove this workflow file
# immediately after the single run. Never schedule this one-time operation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-week-preview-once.yml'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-reservation-sync
  cancel-in-progress: false

jobs:
  preview-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MATCHPOINT_ENABLED: 'true'
      MATCHPOINT_PAUSED: ${{ vars.MATCHPOINT_PAUSED }}
      MATCHPOINT_FEEDS: 'bookings'
      MATCHPOINT_EXTENDED_SCAN: 'false'
      MATCHPOINT_ONE_TIME_WEEK: '2026-11-16'
      MATCHPOINT_HOST: https://padelon-lb.matchpoint.com.es
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MATCHPOINT_LOOKAHEAD_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync MatchPoint bookings for one week (one counted API request)
        run: node scripts/matchpoint-sync.mjs
