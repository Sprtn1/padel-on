name: Verify MatchPoint API (manual, read-only, quota-accounted)

# ONE-TIME EXPLICIT USER-AUTHORIZED TEST on 2026-11-16.
# Merging this workflow on main triggers the diagnostic once. The DB accepts
# only ONE such claim on that date and still caps ALL API attempts at 24/day.
# Revert this workflow to manual-only immediately after reviewing the result.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-connection-check.yml'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MATCHPOINT_HOST: ${{ secrets.MATCHPOINT_HOST }}
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_ONE_TIME_OVERRIDE: '2026-11-16'
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check MatchPoint website network without calling the Query API
        run: node scripts/matchpoint-network-probe.mjs
      - name: One-time user-approved booking API response (counts one request against daily quota)
        run: node scripts/matchpoint-connection-check.mjs
