name: Verify MatchPoint API (manual, quota-accounted)

# Single explicit user-authorized readiness test on November 16, 2026.
# This triggers on exactly one trusted main merge; immediately restore to
# manual-only after the result. All API attempts are counted in Supabase.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-connection-check.yml'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Host supplied by MatchPoint for the Query API; not the separate app-* login site.
      MATCHPOINT_HOST: ${{ secrets.MATCHPOINT_HOST }}
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_READINESS_ONCE: '2026-11-16-only'
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check MatchPoint website network without calling the Query API
        run: node scripts/matchpoint-network-probe.mjs
      - name: Check one MatchPoint booking API response if Beirut-time quota allows
        run: node scripts/matchpoint-connection-check.mjs
