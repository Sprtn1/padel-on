name: Verify MatchPoint API (one-time corrected host, quota-accounted)

# ONE-TIME read-only connection test after the corrected API hostname.
# Triggered solely by merging this workflow on main; then restored to
# manual-only immediately. The Supabase quota RPC permits at most one
# bookings call per allowed local slot and 24 actual API calls per day.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-connection-check.yml'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Host supplied by MatchPoint for the Query API; not the separate app-* login site.
      MATCHPOINT_HOST: https://padelon-lb.matchpoint.com.es
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check MatchPoint website network without calling the Query API
        run: node scripts/matchpoint-network-probe.mjs
      - name: Check one MatchPoint booking API response if Beirut-time quota allows
        run: node scripts/matchpoint-connection-check.mjs
