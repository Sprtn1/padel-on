name: Diagnose MatchPoint network (no API calls)

# Temporary one-shot check: run only when this diagnostic lands on main.
# The workflow will be removed after inspecting the results.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-connection-check.yml'
      - 'scripts/matchpoint-connection-check.mjs'
      - 'tests/matchpoint-connection-check.test.js'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MATCHPOINT_HOST: ${{ secrets.MATCHPOINT_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check DNS, TLS and website connectivity (zero API requests)
        run: node scripts/matchpoint-network-probe.mjs
