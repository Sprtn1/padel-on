name: MatchPoint booking sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-reservation-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MATCHPOINT_ENABLED: ${{ vars.MATCHPOINT_ENABLED }}
      MATCHPOINT_HOST: ${{ secrets.MATCHPOINT_HOST }}
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MATCHPOINT_LOOKAHEAD_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync reservations (read only from MatchPoint; financial amounts never imported)
        run: node scripts/matchpoint-sync.mjs
