name: MatchPoint backend configuration

# Supabase Cron owns the live booking schedule.
# This workflow only stores or updates server-side encrypted configuration.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchpoint-reservations-sync.yml'

permissions:
  contents: read

concurrency:
  group: padelon-matchpoint-reservation-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MATCHPOINT_ENABLED: 'true'
      MATCHPOINT_PAUSED: ${{ vars.MATCHPOINT_PAUSED }}
      MATCHPOINT_FEEDS: 'bookings'
      MATCHPOINT_EXTENDED_SCAN: 'false'
      # Host supplied by MatchPoint for the Query API; not the separate app-* login site.
      MATCHPOINT_HOST: https://padelon-lb.matchpoint.com.es
      MATCHPOINT_API_TOKEN: ${{ secrets.MATCHPOINT_API_TOKEN }}
      MATCHPOINT_COURT_MAP_JSON: ${{ secrets.MATCHPOINT_COURT_MAP_JSON }}
      MATCHPOINT_CENTER_CODE: ${{ vars.MATCHPOINT_CENTER_CODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MATCHPOINT_LOOKAHEAD_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision encrypted backend MatchPoint configuration
        run: |
          node --input-type=module <<'JS'
          const e=process.env;
          const response=await fetch(e.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/matchpoint_set_cron_config',{
            method:'POST',
            headers:{apikey:e.SUPABASE_SERVICE_ROLE_KEY,Authorization:'Bearer '+e.SUPABASE_SERVICE_ROLE_KEY,'Content-Type':'application/json'},
            body:JSON.stringify({p_token:e.MATCHPOINT_API_TOKEN,p_map:e.MATCHPOINT_COURT_MAP_JSON,p_center:e.MATCHPOINT_CENTER_CODE||'',p_paused:e.MATCHPOINT_PAUSED==='true'}),
            redirect:'error'
          });
          if(!response.ok||await response.json()!==true)throw Error('Backend configuration provisioning failed (HTTP '+response.status+')');
          console.log('Encrypted backend configuration provisioned.');
          JS
